<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toyota RAV4 — Vista 360° — Grupo Pana</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:     #cf152d;
      --black:   #111111;
      --gray:    #f5f5f5;
      --mid:     #888888;
      --white:   #ffffff;
      --radius:  12px;
      --font:    'Segoe UI', Arial, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--black);
      font-family: var(--font);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--black);
      border-bottom: 2px solid var(--red);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 36px;
      height: 36px;
      background: var(--red);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--white);
    }

    .logo-text {
      font-size: 13px;
      line-height: 1.3;
      color: var(--white);
    }

    .logo-text strong {
      display: block;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .header-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--red);
      border: 1px solid var(--red);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ── 360 VIEWER ── */
    .viewer-wrap {
      position: relative;
      background: linear-gradient(160deg, #1a1a1a 0%, #0d0d0d 100%);
      padding: 24px 0 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    .viewer-360 {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 960 / 470;
      margin: 0 auto;
      position: relative;
      cursor: grab;
      touch-action: pan-y;
    }

    .viewer-360:active {
      cursor: grabbing;
    }

    .viewer-360 img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.02s linear;
    }

    .viewer-360 img.active {
      opacity: 1;
    }

    .drag-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 14px auto 0;
      max-width: 640px;
      font-size: 12px;
      color: var(--mid);
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .drag-hint.hidden {
      opacity: 0;
    }

    .drag-hint svg {
      flex-shrink: 0;
      animation: swipe 1.6s ease-in-out infinite;
    }

    @keyframes swipe {
      0%, 100% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
    }

    /* ── INFO STRIP ── */
    .info-strip {
      background: var(--black);
      padding: 16px 20px 0;
    }

    .model-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 4px;
    }

    .model-name {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .model-sub {
      font-size: 13px;
      color: var(--mid);
      margin-top: 4px;
    }

    /* ── COLOR SELECTOR ── */
    .color-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 0;
    }

    .color-swatch {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .color-swatch.active {
      border-color: var(--red);
      transform: scale(1.12);
    }

    .color-swatch:active {
      transform: scale(0.95);
    }

    .color-name {
      font-size: 13px;
      color: var(--mid);
    }

    /* ── ACTIONS ── */
    .actions {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      border-radius: var(--radius);
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      opacity: 0.85;
      transform: scale(0.98);
    }

    .btn-wa {
      background: #25D366;
      color: var(--white);
    }

    .btn-call {
      background: transparent;
      color: var(--white);
      border: 1.5px solid #333;
    }

    /* ── FOOTER ── */
    footer {
      padding: 24px 20px 32px;
      text-align: center;
      font-size: 11px;
      color: #444;
      border-top: 1px solid #1e1e1e;
    }

    footer a { color: #666; text-decoration: none; }

    @media (prefers-reduced-motion: reduce) {
      .btn, .drag-hint svg { transition: none; animation: none; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-badge">GP</div>
      <div class="logo-text">
        <strong>Grupo Pana</strong>
        Toyota
      </div>
    </div>
    <div class="header-tag">Vista 360°</div>
  </header>

  <!-- 360 VIEWER -->
  <div class="viewer-wrap">
    <div class="viewer-360" id="viewer360">
      <!-- Images injected by JS -->
    </div>
    <div class="drag-hint" id="dragHint">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l-6-6 6-6"/>
        <path d="M15 6l6 6-6 6"/>
      </svg>
      Arrastra para girar 360°
    </div>
  </div>

  <!-- INFO -->
  <div class="info-strip">
    <p class="model-tag">Nuevo 2025</p>
    <h1 class="model-name">Toyota RAV4</h1>
    <p class="model-sub">Explora el vehículo desde todos los ángulos</p>
  </div>

  <!-- COLOR SELECTOR -->
  <div class="color-row">
    <div class="color-swatch active" style="background:#f0f0f0; border-color:#cf152d" data-color="blanco-perlado" onclick="selectColor('blanco-perlado', this)"></div>
    <span class="color-name" id="colorName">Blanco Perlado (2VP)</span>
  </div>

  <!-- ACTIONS -->
  <div class="actions">

    <!-- WHATSAPP -->
    <a
      class="btn btn-wa"
      href="https://wa.me/51905468250?text=Hola%2C%20vi%20el%20Toyota%20RAV4%20en%20la%20web%20y%20quiero%20m%C3%A1s%20informaci%C3%B3n."
      target="_blank"
      rel="noopener"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      Consultar por WhatsApp
    </a>

    <!-- LLAMAR -->
    <a class="btn btn-call" href="tel:+5116168600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/>
      </svg>
      Llamar a un asesor
    </a>

  </div>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 Grupo Pana Toyota · Lima, Moquegua, Tacna</p>
    <p style="margin-top:6px"><a href="https://grupopana.com.pe">grupopana.com.pe</a></p>
  </footer>

  <script>
    // ── CONFIG ──
    const TOTAL_FRAMES = 12;
    const colors = {
      "blanco-perlado": { label: "Blanco Perlado (2VP)", swatch: "#f0f0f0" }
      // Para agregar más colores, sube las imágenes a images/rav4/<color>/01.jpg ... 12.jpg
      // y agrega aquí: "color-id": { label: "Nombre Color", swatch: "#hex" }
    };

    let currentColor = "blanco-perlado";
    let currentFrame = 0;
    const viewer = document.getElementById('viewer360');
    const dragHint = document.getElementById('dragHint');

    function buildFrames(color) {
      viewer.innerHTML = "";
      for (let i = 1; i <= TOTAL_FRAMES; i++) {
        const img = document.createElement('img');
        const num = String(i).padStart(2, '0');
        img.src = `images/rav4/${color}/${num}.jpg`;
        img.alt = `Toyota RAV4 - frame ${i}`;
        img.draggable = false;
        if (i - 1 === currentFrame) img.classList.add('active');
        viewer.appendChild(img);
      }
    }

    function showFrame(index) {
      const frames = viewer.querySelectorAll('img');
      frames.forEach((f, i) => f.classList.toggle('active', i === index));
      currentFrame = index;
    }

    function selectColor(colorId, el) {
      currentColor = colorId;
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('colorName').textContent = colors[colorId].label;
      buildFrames(colorId);
    }

    // ── DRAG / SWIPE LOGIC ──
    let isDragging = false;
    let startX = 0;
    let startFrame = 0;
    const SENSITIVITY = 18; // px per frame step

    function onDragStart(x) {
      isDragging = true;
      startX = x;
      startFrame = currentFrame;
      viewer.style.cursor = 'grabbing';
      hideHint();
    }

    function onDragMove(x) {
      if (!isDragging) return;
      const delta = x - startX;
      const steps = Math.round(delta / SENSITIVITY);
      let newFrame = (startFrame - steps) % TOTAL_FRAMES;
      if (newFrame < 0) newFrame += TOTAL_FRAMES;
      if (newFrame !== currentFrame) showFrame(newFrame);
    }

    function onDragEnd() {
      isDragging = false;
      viewer.style.cursor = 'grab';
    }

    function hideHint() {
      dragHint.classList.add('hidden');
    }

    // Mouse events
    viewer.addEventListener('mousedown', e => onDragStart(e.clientX));
    window.addEventListener('mousemove', e => onDragMove(e.clientX));
    window.addEventListener('mouseup', onDragEnd);

    // Touch events
    viewer.addEventListener('touchstart', e => onDragStart(e.touches[0].clientX), { passive: true });
    viewer.addEventListener('touchmove', e => {
      onDragMove(e.touches[0].clientX);
    }, { passive: true });
    viewer.addEventListener('touchend', onDragEnd);

    // Init
    buildFrames(currentColor);

    // Auto-hide hint after a few seconds even without interaction
    setTimeout(hideHint, 5000);
  </script>

</body>
</html>
